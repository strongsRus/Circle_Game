<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Draw a perfect circle</title>
<style>
:root{--bg:#000;--text:#f2f2f2;--muted:#8c8c8c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font-family:"Fraunces",Georgia,"Times New Roman",serif;display:flex;flex-direction:column;overflow:hidden}
header{display:flex;justify-content:space-between;align-items:baseline;padding:16px 20px 0;gap:12px}
h1{font-size:clamp(1.2rem,4vw,1.7rem);font-weight:600;margin:0;letter-spacing:-.01em}
.best{color:var(--muted);font-size:.95rem;white-space:nowrap}
main{flex:1;position:relative;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#hint{position:absolute;left:0;right:0;top:6%;text-align:center;pointer-events:none;padding:0 24px;color:var(--muted);font-size:1.1rem;transition:opacity .2s}
#result{position:absolute;left:0;right:0;top:4%;text-align:center;pointer-events:none;opacity:0;transition:opacity .25s}
#result.on{opacity:1}
#score{font-size:clamp(3rem,15vw,5.5rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;text-shadow:0 0 14px #000,0 0 28px #000}
#msg{font-size:1.1rem;margin-top:6px;padding:0 20px;white-space:pre-line;text-shadow:0 0 10px #000,0 0 20px #000}
footer{display:none}
#timer{position:absolute;left:0;right:0;top:0;height:5px;pointer-events:none}
#timerbar{height:100%;width:100%;transform-origin:left;transform:scaleX(0);background:#4cf07a}
</style>
</head>
<body>
<header><h1>Draw a perfect circle</h1><div class="best">Best <span id="best">–</span></div></header>
<main>
<canvas id="c"></canvas>
<div id="timer"><div id="timerbar"></div></div>
<div id="hint"></div>
<div id="result"><div id="score"></div><div id="msg"></div></div>
</main>
<footer id="foot">Tap or click and drag anywhere</footer>
<script>
(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var hint=document.getElementById('hint'),res=document.getElementById('result'),timerBar=document.getElementById('timerbar');
var scoreEl=document.getElementById('score'),msgEl=document.getElementById('msg'),bestEl=document.getElementById('best'),foot=document.getElementById('foot');
var pts=[],drawing=false,best=0,dpr=1,W=0,H=0,cx=0,cy=0,ideal=null,rafPending=false,sumR=0,ema=0,LIMIT=5000,t0=0,timerId=0;
try{var b=parseFloat(localStorage.getItem('pc-best'));if(b>0){best=b;bestEl.textContent=b.toFixed(1)+'%';}}catch(e){}

function resize(){
  dpr=window.devicePixelRatio||1;var r=cv.getBoundingClientRect();W=r.width;H=r.height;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  cx=W/2;cy=H/2;render();
}
window.addEventListener('resize',resize);

function minR(){return Math.max(70,Math.min(W,H)*0.15);}
function colorFor(d){var t=Math.max(0,Math.min(1,d/0.13));return 'hsl('+Math.round(135*(1-t))+',95%,58%)';}

function render(){
  ctx.clearRect(0,0,W,H);
  if(ideal){
    ctx.strokeStyle='rgba(255,255,255,.45)';ctx.lineWidth=1.5;ctx.setLineDash([6,8]);
    ctx.beginPath();ctx.arc(cx,cy,ideal,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
  }
  // centre point
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,5,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(cx,cy,12,0,Math.PI*2);ctx.stroke();
  if(pts.length<2)return;
  ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=5;ctx.shadowBlur=10;
  for(var i=1;i<pts.length;i++){
    ctx.strokeStyle=pts[i].c;ctx.shadowColor=pts[i].c;
    ctx.beginPath();ctx.moveTo(pts[i-1].x,pts[i-1].y);ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();
  }
  ctx.shadowBlur=0;
}
function queue(){if(!rafPending){rafPending=true;requestAnimationFrame(function(){rafPending=false;render();});}}

function pos(e){var r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,c:'#fff'};}
function add(p){
  var r=Math.hypot(p.x-cx,p.y-cy);sumR+=r;
  var ref=sumR/(pts.length+1),d=Math.abs(r-ref)/Math.max(ref,1);
  ema=ema*0.85+d*0.15;p.c=colorFor(ema);pts.push(p);
}
cv.addEventListener('pointerdown',function(e){
  e.preventDefault();cv.setPointerCapture(e.pointerId);
  drawing=true;ideal=null;pts=[];sumR=0;ema=0;add(pos(e));startTimer();
  hint.style.opacity=0;res.classList.remove('on');foot.textContent='';
  render();
});
cv.addEventListener('pointermove',function(e){
  if(!drawing)return;e.preventDefault();
  var evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  for(var i=0;i<evs.length;i++)add(pos(evs[i]));
  queue();
});
function end(){if(!drawing)return;drawing=false;stopTimer();finish();}
cv.addEventListener('pointerup',end);
cv.addEventListener('pointercancel',end);

function startTimer(){
  stopTimer();t0=performance.now();
  (function tick(){
    var f=1-(performance.now()-t0)/LIMIT;
    if(f<=0){
      timerBar.style.transform='scaleX(0)';
      drawing=false;timerId=0;
      reset('Time’s up! You have 5 seconds to draw the circle.');
      return;
    }
    timerBar.style.transform='scaleX('+f+')';
    timerBar.style.background='hsl('+Math.round(135*f)+',90%,55%)';
    timerId=requestAnimationFrame(tick);
  })();
}
function stopTimer(){if(timerId){cancelAnimationFrame(timerId);timerId=0;}}

function resample(p,n){
  var L=0,i;for(i=1;i<p.length;i++)L+=Math.hypot(p[i].x-p[i-1].x,p[i].y-p[i-1].y);
  var step=L/n,out=[p[0]],acc=0;
  for(i=1;i<p.length;i++){
    var a=p[i-1],c=p[i],d=Math.hypot(c.x-a.x,c.y-a.y);
    while(acc+d>=step&&d>0){var t=(step-acc)/d;a={x:a.x+(c.x-a.x)*t,y:a.y+(c.y-a.y)*t};out.push(a);d=Math.hypot(c.x-a.x,c.y-a.y);acc=0;}
    acc+=d;
  }
  return out;
}

function finish(){
  if(pts.length<12){reset('Too short. Draw a full loop around the dot.');return;}
  var p=resample(pts,240),i,R=0;
  for(i=0;i<p.length;i++)R+=Math.hypot(p[i].x-cx,p[i].y-cy);
  R/=p.length;
  if(R<minR()){reset('Too small. Draw a bigger circle around the dot.');return;}
  var sweep=0,prev=Math.atan2(p[0].y-cy,p[0].x-cx);
  for(i=1;i<p.length;i++){
    var a=Math.atan2(p[i].y-cy,p[i].x-cx),d=a-prev;
    if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;
    sweep+=d;prev=a;
  }
  if(Math.abs(sweep)<Math.PI*2*0.85){reset('That doesn’t go all the way around the dot.');return;}
  var dev=0;for(i=0;i<p.length;i++)dev+=Math.abs(Math.hypot(p[i].x-cx,p[i].y-cy)-R);
  dev/=p.length*R;
  var gap=Math.hypot(pts[0].x-pts[pts.length-1].x,pts[0].y-pts[pts.length-1].y)/R;
  var s=Math.max(0,Math.min(100,100-dev*120-Math.min(gap,1)*10));
  // recolour the stroke against the final radius
  var e2=0;
  for(i=0;i<pts.length;i++){
    var dd=Math.abs(Math.hypot(pts[i].x-cx,pts[i].y-cy)-R)/R;
    e2=e2*0.8+dd*0.2;pts[i].c=colorFor(e2);
  }
  ideal=R;render();
  scoreEl.textContent=s.toFixed(1)+'%';
  scoreEl.style.color='hsl('+Math.round(Math.max(0,(s-50)/50)*135)+',95%,60%)';
  msgEl.textContent=s>95?'Congratulations!\nThe cache can be found at:\nN50 47.000 W002 00.000':verdict(s,gap);
  res.classList.add('on');
  foot.textContent='Draw again to retry';
  if(s>best){best=s;bestEl.textContent=s.toFixed(1)+'%';try{localStorage.setItem('pc-best',String(s));}catch(e){}}
}
function verdict(s,gap){
  if(s>=98)return 'Are you a compass?';
  if(s>=95)return 'Frighteningly round.';
  if(s>=90)return 'Very good. Almost suspicious.';
  if(s>=80)return 'Solid circle. A little wobble.';
  if(s>=65)return gap>.25?'Your ends don’t meet. Close the loop.':'Egg-ish. Keep a steady distance from the dot.';
  if(s>=40)return 'More of a potato.';
  return 'That’s a bean. Try again.';
}
function reset(m){
  ideal=null;pts=[];render();
  hint.innerHTML=m;hint.style.opacity=1;
  foot.textContent='Tap or click and drag anywhere';
}
resize();
})();
</script>
</body>
</html>
